# Usage:
#   cp .env.example .env      # then set real passwords and SECRET_KEY
#   docker compose up -d --build
#   docker compose exec backend python -m app.seed      # demo users + synthetic patients (dev only)
# App: http://localhost:8080   API docs: http://localhost:8080/docs

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_db}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host; only the backend can reach it.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hospital_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hospital_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      HOSPITAL_NAME: ${HOSPITAL_NAME:-Government District Hospital}
      HOSPITAL_ADDRESS: ${HOSPITAL_ADDRESS:-}
      HOSPITAL_PHONE: ${HOSPITAL_PHONE:-}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DOCTOR_PASSWORD: ${SEED_DOCTOR_PASSWORD:-}
      SEED_RECEPTIONIST_PASSWORD: ${SEED_RECEPTIONIST_PASSWORD:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  pgdata:
